aid: hosta-ai
name: Hosta a.i.
description: >-
  Hosta a.i. is an AI-powered remote property assessment platform that turns ordinary
  photographs from any camera into precise measurements, detailed floor plans, material
  classifications, condition assessments, and bills of materials. Using patented AI spatial
  and material analytics, Hosta automates onsite property analysis without specialized
  equipment or site visits, and exposes these capabilities through configurable APIs so
  insurers, appraisers, inspectors, contractors, property managers, home-improvement
  platforms, and furniture retailers can embed remote assessment into their existing
  workflows and systems. Founded in 2020 and headquartered in Cambridge, Massachusetts,
  Hosta is a Techstars- and Eclipse-backed company operating on a secure AWS cloud platform
  with PII filtering protections.
